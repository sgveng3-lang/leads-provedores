name: raspar
run-name: "raspar ${{ inputs.uf }} · ${{ inputs.pedido }}"

on:
  workflow_dispatch:
    inputs:
      uf:
        description: "UF(s) separadas por vírgula, ou TODAS"
        required: true
        default: "MG"
      limite:
        description: "Máximo de provedores nesta execução"
        default: "100"
      min_acessos:
        description: "Mínimo de assinantes (acessos)"
        default: "200"
      max_acessos:
        description: "Máximo de assinantes (0 = sem limite)"
        default: "0"
      pedido:
        description: "Identificador do pedido (o bot preenche)"
        default: "manual"

permissions:
  contents: read

concurrency:
  group: raspar
  cancel-in-progress: false

jobs:
  raspar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - id: chave
        run: python scraper/main.py chave >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: _dados/base.json.gz
          key: base-${{ steps.chave.outputs.chave }}

      - name: Montar base (Anatel + Receita) — só quando muda o mês
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scraper/main.py base

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _dados/base.json.gz
          key: base-${{ steps.chave.outputs.chave }}

      - uses: actions/cache/restore@v4
        with:
          path: _dados/cnpj_cache.json.gz
          key: cnpj-${{ github.run_id }}
          restore-keys: cnpj-

      - name: Raspar sites e gravar na planilha
        env:
          PLANILHA_URL: ${{ secrets.PLANILHA_URL }}
          PLANILHA_TOKEN: ${{ secrets.PLANILHA_TOKEN }}
        run: >
          python scraper/main.py raspar
          --uf "${{ inputs.uf }}" --limite "${{ inputs.limite }}"
          --min-acessos "${{ inputs.min_acessos }}" --max-acessos "${{ inputs.max_acessos }}"
          --pedido "${{ inputs.pedido }}"

      - if: always()
        uses: actions/cache/save@v4
        with:
          path: _dados/cnpj_cache.json.gz
          key: cnpj-${{ github.run_id }}

      # só contagens (repo público) — o bot lê este arquivo pra responder no WhatsApp
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumo
          path: _dados/resumo.json
          if-no-files-found: ignore
          retention-days: 3
