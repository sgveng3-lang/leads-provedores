name: filtrar
run-name: "filtrar alvos · ${{ inputs.pedido || 'mensal' }}"

# Filtro fiscal: refaz a aba "alvo" (provedores pequenos x Dívida Ativa da União).
# Automático 1x por mês, no DIA 1º às 06:00 (Brasília), depois da raspagem do último
# dia do mês: quem dispara é o bot do Discloud (pedido "mensal-bot"). O cron abaixo
# (dia 1º, 12:00) é só reserva: o job "guarda" pula se o bot já filtrou nesse dia.
on:
  schedule:
    - cron: "0 15 1 * *" # 12:00 Brasília do dia 1º: reserva, depois do bot
  workflow_dispatch:
    inputs:
      pedido:
        description: "Identificador do pedido (o bot preenche)"
        default: "manual"

permissions:
  contents: read

concurrency:
  group: filtrar
  cancel-in-progress: false

jobs:
  guarda:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ja_rodou: ${{ steps.v.outputs.ja_rodou }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hoje=$(date -u -d '3 hours ago' +%F)   # data de Brasília (UTC-3)
          desde="${hoje}T03:00:00Z"
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w filtrar.yml -L 30 --json displayTitle,createdAt \
            --jq "[.[] | select((.displayTitle | endswith(\"mensal-bot\")) and .createdAt >= \"$desde\")] | length")
          echo "filtros do bot desde $desde: $n"
          echo "ja_rodou=$([ "$n" -gt 0 ] && echo sim || echo nao)" >> "$GITHUB_OUTPUT"

  filtrar:
    needs: guarda
    # explícito: com o "guarda" pulado (disparo manual), o padrão success() pularia este job
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.guarda.outputs.ja_rodou == 'nao') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      # dados da Anatel: o mesmo cache da raspagem (monta de novo se não houver)
      - id: chave
        run: python scraper/main.py chave >> "$GITHUB_OUTPUT"
      - id: base
        uses: actions/cache/restore@v4
        with:
          path: _dados/base.json.gz
          key: base-${{ steps.chave.outputs.chave }}
      - name: Montar base (Anatel)
        if: steps.base.outputs.cache-hit != 'true'
        run: python scraper/main.py base
      - if: steps.base.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _dados/base.json.gz
          key: base-${{ steps.chave.outputs.chave }}
      # porte/Simples/e-mail/CNAE já consultados (validade de 90 dias no script)
      - uses: actions/cache/restore@v4
        with:
          path: _dados/fiscal_cache.json.gz
          key: fiscal-${{ github.run_id }}
          restore-keys: fiscal-
      - name: Filtrar e gravar a aba alvo
        env:
          PLANILHA_URL: ${{ secrets.PLANILHA_URL }}
          PLANILHA_TOKEN: ${{ secrets.PLANILHA_TOKEN }}
        run: python filtro/filtrar.py --pedido "${{ inputs.pedido || 'mensal' }}"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: _dados/fiscal_cache.json.gz
          key: fiscal-${{ github.run_id }}
      # só contagens (repo público) — o bot lê este resumo
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumo-filtro
          path: _dados/resumo-filtro.json
          if-no-files-found: ignore
          retention-days: 7
