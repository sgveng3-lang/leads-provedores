name: diagnostico
# Testa, a partir da máquina do GitHub, quais fontes respondem.
on:
  push:
    paths: [".github/workflows/diagnostico.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  NAVEGADOR: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
jobs:
  rede:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: opencnpj
        run: |
          curl -sS --max-time 30 -A "$NAVEGADOR" https://api.opencnpj.org/04573288000144 | grep -qi "painsonline"
      - name: opencnpj-rajada
        if: always()
        run: |
          for i in $(seq 1 15); do curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 -A "$NAVEGADOR" https://api.opencnpj.org/04573288000144; done | sort | uniq -c
          test "$(for i in $(seq 1 5); do curl -s -o /dev/null -w "%{http_code}\n" --max-time 20 -A "$NAVEGADOR" https://api.opencnpj.org/04573288000144; done | grep -c 200)" -ge 4
      - name: cnpja
        if: always()
        run: |
          curl -sS --max-time 30 -A "$NAVEGADOR" https://open.cnpja.com/office/04573288000144 | grep -qi "painsonline"
      - name: cnpjws
        if: always()
        run: |
          curl -sS --max-time 30 -A "$NAVEGADOR" https://publica.cnpj.ws/cnpj/04573288000144 | grep -qi "painsonline"
      - name: receitaws
        if: always()
        run: |
          curl -sS --max-time 30 -A "$NAVEGADOR" https://receitaws.com.br/v1/cnpj/04573288000144 | grep -qi "painsonline"
