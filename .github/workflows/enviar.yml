name: enviar
run-name: "enviar e-mails · ${{ inputs.origem || github.event_name }}"

# Prospecção em ritmo lento: dias úteis às 09:00 (Brasília).
# Quem dispara às 09:00 é o bot do Discloud (origem "diario"), porque o agendamento
# do GitHub atrasa horas (já iniciou às 14:40). O cron abaixo (11:00) fica só de reserva:
# se o envio "diario" do bot já rodou hoje, o job "guarda" impede um segundo lote.
# Limite por dia na variável do repositório ENVIO_LIMITE (padrão 15).
# Liga/desliga o envio AUTOMÁTICO: variável ENVIO_LIGADO = sim (o bot do WhatsApp controla).
on:
  schedule:
    - cron: "0 14 * * 1-5" # 11:00 Brasília: reserva, depois do bot
  workflow_dispatch:
    inputs:
      limite:
        description: "Quantos e-mails nesta execução"
        default: "15"
      teste_para:
        description: "Modo teste: manda tudo pra este e-mail e não marca na planilha (vazio = envio real)"
        default: ""
      origem:
        description: "Quem disparou (o bot usa 'diario' no envio das 09:00)"
        default: "manual"

permissions:
  contents: read

concurrency:
  group: enviar
  cancel-in-progress: false

jobs:
  # agendado (reserva): confere se o envio "diario" do bot já rodou hoje
  guarda:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ja_enviou: ${{ steps.v.outputs.ja_enviou }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde="$(date -u -d '3 hours ago' +%F)T03:00:00Z"   # meia-noite de Brasília (UTC-3) em UTC
          # conta envios disparados (bot/manual) que deram certo ou ainda estão rodando; um que falhou não impede a reserva
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w enviar.yml -L 30 --json event,conclusion,createdAt \
            --jq "[.[] | select(.event == \"workflow_dispatch\" and (.conclusion == \"success\" or .conclusion == \"\") and .createdAt >= \"$desde\")] | length")
          echo "envios disparados (ok ou em andamento) desde $desde: $n"
          echo "ja_enviou=$([ "$n" -gt 0 ] && echo sim || echo nao)" >> "$GITHUB_OUTPUT"

  enviar:
    needs: guarda
    # disparo manual (bot/GitHub) sempre roda; agendado só com ENVIO_LIGADO=sim e se o bot não enviou hoje
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (vars.ENVIO_LIGADO == 'sim' && needs.guarda.outputs.ja_enviou == 'nao')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Enviar
        env:
          PLANILHA_URL: ${{ secrets.PLANILHA_URL }}
          PLANILHA_TOKEN: ${{ secrets.PLANILHA_TOKEN }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_REMETENTE: ${{ vars.ZOHO_REMETENTE }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.zoho.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          REMETENTE_NOME: ${{ vars.REMETENTE_NOME || 'Equipe SepiaStream' }}
        run: >
          python envio/enviar.py --limite "${{ inputs.limite || vars.ENVIO_LIMITE || '15' }}"
          --teste-para "${{ inputs.teste_para }}"

      # só contagens (repo público) — o bot lê este resumo e avisa no grupo
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumo-envio
          path: _dados/resumo-envio.json
          if-no-files-found: ignore
          retention-days: 3
